# Curated camera tiles for the avyoats.com tour page.
#
# Each tile renders an <img> snapshot first; if the snapshot URL returns a 4xx
# (some UDOT/Snowbird endpoints do that for direct hotlinking) the Stimulus
# controller swaps it to a "View on source" link tile so the page still works.
#
# Image URLs are best-effort; link URLs always point at the official source.

